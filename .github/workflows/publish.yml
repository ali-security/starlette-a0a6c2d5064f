name: Publish

on:
  push:
    branches: [main]
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: scripts/install

      - name: Run tests
        run: scripts/test

      - name: Build package & docs
        # Pin the wheel build backend so the WHEEL `Generator:` line matches the
        # public release (hatchling 1.27.0). A default build would pull the newest
        # matching hatchling and break byte-equivalence. The constraints file lives
        # in RUNNER_TEMP (outside the checkout) so it never enters the sdist.
        run: |
          echo "hatchling==1.27.0" > "$RUNNER_TEMP/build-constraints.txt"
          scripts/build
        env:
          UV_BUILD_CONSTRAINT: ${{ runner.temp }}/build-constraints.txt

      - name: Upload package distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-distributions
          path: dist/
